<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>强队错杀 · 总览</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #0b0e11; color: #eaecef; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  .nav { background: #161a1e; border-bottom: 1px solid #2b3139; padding: 0 16px; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; position: sticky; top: 0; z-index: 10; }
  .nav .brand { color: #f0b90b; font-weight: 700; padding: 12px 16px 12px 0; font-size: 15px; }
  .nav a { color: #848e9c; text-decoration: none; padding: 12px 14px; font-size: 14px; border-bottom: 2px solid transparent; }
  .nav a:hover { color: #eaecef; }
  .nav a.active { color: #f0b90b; border-bottom-color: #f0b90b; }
  .wrap { padding: 16px; max-width: 1200px; margin: 0 auto; }
  .muted { color: #848e9c; font-size: 12px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 16px 0; }
  .card { background: #1e2329; border-radius: 8px; padding: 14px 16px; }
  .card .label { font-size: 12px; color: #848e9c; }
  .card .value { font-size: 22px; font-weight: 600; margin-top: 6px; }
  .up { color: #0ecb81; } .down { color: #f6465d; } .warn { color: #f0b90b; }
  .panel { background: #1e2329; border-radius: 8px; padding: 14px 16px; margin-bottom: 16px; overflow-x: auto; }
  .panel h2 { font-size: 14px; color: #848e9c; margin-bottom: 10px; font-weight: 500; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: #848e9c; font-weight: 500; padding: 6px 8px; border-bottom: 1px solid #2b3139; white-space: nowrap; }
  td { padding: 8px; border-bottom: 1px solid #161a1e; white-space: nowrap; }
  .tag { padding: 2px 8px; border-radius: 4px; font-size: 12px; }
  .t-open { background: #2b3139; color: #f0b90b; }
  .t-filled { background: rgba(14,203,129,.15); color: #0ecb81; }
  .t-missed { background: rgba(70,80,100,.3); color: #848e9c; }
  .t-placed { background: rgba(240,185,11,.15); color: #f0b90b; }
  .t-watch { background: rgba(70,80,100,.3); color: #848e9c; }
  .t-ready { background: rgba(14,203,129,.15); color: #0ecb81; }
  .p-hot { color: #f6465d; font-weight: 600; }
  .p-mid { color: #f0b90b; font-weight: 600; }
  .p-low { color: #0ecb81; font-weight: 600; }
  .p-obs { color: #848e9c; }
  .grid2 { display: grid; grid-template-columns: 3fr 2fr; gap: 16px; }
  @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
  #log { font-family: Consolas, monospace; font-size: 12px; color: #aeb4bc; white-space: pre-wrap; max-height: 220px; overflow-y: auto; }
  #errbar { display: none; background: #3b1518; color: #f6465d; padding: 10px 16px; font-size: 13px; }
</style>
</head>
<body>
<nav class="nav">
  <span class="brand">⚽ 强队错杀</span>
  <a href="index.html" class="active">总览</a>
  <a href="standings.html?league=英超">英超</a>
  <a href="standings.html?league=西甲">西甲</a>
  <a href="standings.html?league=德甲">德甲</a>
  <a href="standings.html?league=意甲">意甲</a>
  <a href="standings.html?league=法甲">法甲</a>
</nav>
<div id="errbar"></div>
<div class="wrap">
<div class="muted" id="clock" style="padding-top:10px"></div>
<div class="cards">
  <div class="card"><div class="label">预测钱包可用</div><div class="value" id="avail">-</div></div>
  <div class="card"><div class="label">策略净盈亏</div><div class="value" id="netPnl">-</div></div>
  <div class="card"><div class="label">胜率</div><div class="value up" id="winRate">-</div></div>
  <div class="card"><div class="label">盈亏比</div><div class="value" id="pf">-</div></div>
  <div class="card"><div class="label">强队场次 (&gt;70%)</div><div class="value warn" id="schedCount">-</div></div>
</div>

<div class="panel">
  <h2>🔥 未来强队赛程（盘前胜率 &gt; 70%）　<span class="muted" id="src"></span></h2>
  <table>
    <thead><tr><th>开赛时间</th><th>联赛</th><th>对阵</th><th>强队</th><th>盘前胜率</th><th>排名差</th><th>排名比</th><th>档位</th><th>挂单价</th><th>状态</th></tr></thead>
    <tbody id="schedule"></tbody>
  </table>
</div>

<div class="grid2">
  <div class="panel"><h2>我的挂单 / 成交</h2><table>
    <thead><tr><th>比赛</th><th>强队</th><th>胜率</th><th>挂单价</th><th>金额</th><th>状态</th></tr></thead>
    <tbody id="orders"></tbody></table></div>
  <div class="panel"><h2>每日资金曲线</h2><canvas id="chart"></canvas></div>
</div>

<div class="panel">
  <h2>👀 尾盘观察清单</h2>
  <table>
    <thead><tr><th>开赛</th><th>联赛</th><th>对阵</th><th>强队</th><th>盘前胜率</th><th>排名差</th><th>排名比</th><th>挂单价</th><th>实时比分</th><th>状态</th></tr></thead>
    <tbody id="watchlist"></tbody>
  </table>
</div>

<div class="panel" id="logPanel"><h2>运行日志</h2><div id="log"></div></div>
</div>
<script src="shared.js"></script>
<script>
function probClass(p){ return p>=0.85?'p-hot':p>=0.80?'p-mid':p>=0.75?'p-low':'p-obs'; }
async function refresh(){
  const d = await loadData();
  if (!d) return;
  const isLocal = location.hostname === '127.0.0.1' || location.hostname === 'localhost';
  document.getElementById('logPanel').style.display = isLocal ? '' : 'none';
  document.getElementById('clock').textContent =
    'exchange: ' + (d.exchange||'-') + ' | dry_run: ' + (d.dry_run??'-') + ' | 更新: ' + new Date().toLocaleTimeString();
  document.getElementById('src').textContent =
    '数据源: ' + (d.schedule_source || '-') + ' | 赛程刷新: ' + (d.schedule_updated || '-');

  const bal = (d.account && d.account.balances) || {};
  document.getElementById('avail').textContent = Object.keys(bal).length
    ? '$' + (bal.CeDeFi ?? Object.values(bal).reduce((a,b)=>a+b,0)).toFixed(2) : '-';
  const st = d.stats || {};
  const npEl = document.getElementById('netPnl');
  npEl.textContent = st.net_pnl == null ? '暂无成交' : (st.net_pnl>=0?'+$':'-$') + Math.abs(st.net_pnl).toFixed(2);
  npEl.className = 'value ' + (st.net_pnl == null ? '' : st.net_pnl>=0?'up':'down');
  document.getElementById('winRate').textContent =
    st.win_rate == null ? '暂无成交' : st.win_rate + '%（' + st.wins + '胜' + st.losses + '负）';
  document.getElementById('pf').textContent = st.profit_factor == null ? '暂无成交' : st.profit_factor;

  const sched = d.schedule || [];
  document.getElementById('schedCount').textContent = sched.length;
  document.getElementById('schedule').innerHTML = sched.map(s => {
    const tier = s.discount ? `${(s.discount*10).toFixed(1).replace('.0','')}折 / ${(s.position_pct*100).toFixed(0)}%仓` : '观察(70-75%)';
    const status = s.placed ? '<span class="tag t-placed">已挂单</span>'
      : s.discount ? '<span class="tag t-ready">可挂</span>' : '<span class="tag t-watch">观察</span>';
    const match = (s.home_zh && s.away_zh)
      ? `${teamLogo(s.home_logo,s.home_zh)}${s.home_zh} <span class="muted">vs</span> ${teamLogo(s.away_logo,s.away_zh)}${s.away_zh}`
      : (s.title_zh||s.title);
    const strong = `${teamLogo(s.team_logo,s.team_zh||s.team)}${s.team_zh||s.team}`;
    return `<tr><td>${fmtTime(s.start)}</td><td class="muted">${s.league}</td><td>${match}</td>
      <td>${strong}</td><td class="${probClass(s.prob)}">${(s.prob*100).toFixed(1)}%</td>
      <td>${s.rank_gap != null ? s.rank_gap + '位' : '-'}</td>
      <td>${s.rank_pair && s.rank_pair !== '-' ? s.rank_pair : '-'}</td>
      <td>${tier}</td><td>${s.limit_price ?? '-'}</td><td>${status}</td></tr>`;
  }).join('') || '<tr><td colspan="10" class="muted">未来几天暂无胜率&gt;70%的强弱对阵</td></tr>';

  const orders = Object.values(d.orders || {}).sort((a,b)=>(a.start||'').localeCompare(b.start||''));
  document.getElementById('orders').innerHTML = orders.map(o => {
    const cls = o.status==='OPEN'?'t-open':o.status==='FILLED'?'t-filled':'t-missed';
    const stText = o.status==='FILLED' && o.result ? (o.result==='WIN'?'赢 $'+o.pnl:'输 $'+o.pnl) : o.status;
    return `<tr><td>${o.title_zh||o.title}</td><td>${teamLogo(o.team_logo, o.team_zh||o.team)}${o.team_zh||o.team}</td><td>${(o.prob*100).toFixed(1)}%</td>
      <td>${o.price}</td><td>$${o.usd.toFixed(2)}</td>
      <td><span class="tag ${cls}">${stText}</span></td></tr>`;
  }).join('') || '<tr><td colspan="6" class="muted">暂无挂单</td></tr>';

  const wl = d.watchlist || [];
  document.getElementById('watchlist').innerHTML = wl.map(w => {
    let status;
    if (w.signal === 'TRIGGERED') status = '<span class="tag t-filled">🔥 已触发买入</span>';
    else if (w.signal === 'FILTERED') status = '<span class="tag t-watch">已过滤</span>';
    else if (w.live) status = '<span class="tag t-open">进行中</span>';
    else status = w.watching ? '<span class="tag t-ready">观察中</span>' : '<span class="tag t-watch">未纳入</span>';
    const match = (w.home_zh && w.away_zh)
      ? `${teamLogo(w.home_logo,w.home_zh)}${w.home_zh} <span class="muted">vs</span> ${teamLogo(w.away_logo,w.away_zh)}${w.away_zh}`
      : (w.title_zh || '');
    const strong = `${teamLogo(w.team_logo, w.team_zh||w.team)}${w.team_zh||w.team||'-'}`;
    return `<tr><td>${fmtTime(w.start)}</td><td class="muted">${w.league}</td><td>${match}</td>
      <td>${strong}</td>
      <td>${w.prob != null ? (w.prob*100).toFixed(1) + '%' : '-'}</td>
      <td>${w.rank_gap != null ? w.rank_gap + '位' : '-'}</td>
      <td>${w.rank_pair && w.rank_pair !== '-' ? w.rank_pair : '-'}</td>
      <td>${w.limit_price != null ? w.limit_price : '-'}</td>
      <td>${w.live || '-'}</td><td>${status}</td></tr>`;
  }).join('') || '<tr><td colspan="10" class="muted">未来 72 小时暂无比赛</td></tr>';

  document.getElementById('log').textContent = d.log_tail || '';

  const hist = d.bankroll_history || [];
  if (window._chart) window._chart.destroy();
  window._chart = new Chart(document.getElementById('chart'), {
    type: 'line',
    data: { labels: hist.map(h=>h.date.slice(5)),
      datasets: [{ data: hist.map(h=>h.bankroll), borderColor:'#f0b90b',
        backgroundColor:'rgba(240,185,11,.1)', fill:true, tension:.3, pointRadius:3 }]},
    options: { plugins:{legend:{display:false}}, scales:{
      x:{ticks:{color:'#848e9c'},grid:{color:'#1e2329'}},
      y:{ticks:{color:'#848e9c',callback:v=>'$'+(+v).toFixed(1)},grid:{color:'#1e2329'}}}}
  });
}
refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
