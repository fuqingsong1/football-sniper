<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>尾盘观察清单 · 强队错杀</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #0b0e11; color: #eaecef; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  .nav { background: #161a1e; border-bottom: 1px solid #2b3139; padding: 0 16px; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; position: sticky; top: 0; z-index: 10; }
  .nav .brand { color: #f0b90b; font-weight: 700; padding: 12px 16px 12px 0; font-size: 15px; }
  .nav a { color: #848e9c; text-decoration: none; padding: 12px 14px; font-size: 14px; border-bottom: 2px solid transparent; }
  .nav a:hover { color: #eaecef; }
  .nav a.active { color: #f0b90b; border-bottom-color: #f0b90b; }
  .wrap { padding: 16px; max-width: 1000px; margin: 0 auto; }
  .muted { color: #848e9c; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: #848e9c; font-weight: 500; padding: 6px 8px; border-bottom: 1px solid #2b3139; white-space: nowrap; }
  td { padding: 8px; border-bottom: 1px solid #161a1e; white-space: nowrap; }
  .panel { background: #1e2329; border-radius: 8px; padding: 14px 16px; margin-top: 16px; overflow-x: auto; }
  .tag { padding: 2px 8px; border-radius: 4px; font-size: 12px; }
  .t-open { background: #2b3139; color: #f0b90b; }
  .t-filled { background: rgba(14,203,129,.15); color: #0ecb81; }
  .t-watch { background: rgba(70,80,100,.3); color: #848e9c; }
  .t-ready { background: rgba(14,203,129,.15); color: #0ecb81; }
  #errbar { display: none; background: #3b1518; color: #f6465d; padding: 10px 16px; font-size: 13px; }
</style>
</head>
<body>
<nav class="nav">
  <span class="brand">⚽ 强队错杀</span>
  <a href="index.html">总览</a>
  <a href="standings.html?league=英超">英超</a>
  <a href="standings.html?league=西甲">西甲</a>
  <a href="standings.html?league=德甲">德甲</a>
  <a href="standings.html?league=意甲">意甲</a>
  <a href="standings.html?league=法甲">法甲</a>
  <a href="watchlist.html" class="active">尾盘观察清单</a>
</nav>
<div id="errbar"></div>
<div class="wrap">
<div class="panel">
  <h2>👀 尾盘观察清单</h2>
  <table>
    <thead><tr><th>开赛</th><th>联赛</th><th>对阵</th><th>强队</th><th>盘前胜率</th><th>排名差</th><th>排名比</th><th>挂单价</th><th>实时比分</th><th>状态</th></tr></thead>
    <tbody id="watchlist"></tbody>
  </table>
</div>
</div>
<script src="shared.js"></script>
<script>
async function refresh(){
  const d = await loadData();
  if (!d) return;
  const wl = d.watchlist || [];
  document.getElementById('watchlist').innerHTML = wl.map(w => {
    let status;
    if (w.signal === 'TRIGGERED') status = '<span class="tag t-filled">🔥 已触发买入</span>';
    else if (w.signal === 'FILTERED') status = '<span class="tag t-watch">已过滤</span>';
    else if (w.live) status = '<span class="tag t-open">进行中</span>';
    else status = w.watching ? '<span class="tag t-ready">观察中</span>' : '<span class="tag t-watch">未纳入</span>';
    const match = (w.home_zh && w.away_zh)
      ? `${teamLogo(w.home_logo,w.home_zh)}${w.home_zh} <span class="muted">vs</span> ${teamLogo(w.away_logo,w.away_zh)}${w.away_zh}`
      : (w.title_zh || '');
    const strong = `${teamLogo(w.team_logo, w.team_zh||w.team)}${w.team_zh||w.team||'-'}`;
    return `<tr><td>${fmtTime(w.start)}</td><td class="muted">${w.league}</td><td>${match}</td>
      <td>${strong}</td>
      <td>${w.prob != null ? (w.prob*100).toFixed(1) + '%' : '-'}</td>
      <td>${w.rank_gap != null ? w.rank_gap + '位' : '-'}</td>
      <td>${w.rank_pair && w.rank_pair !== '-' ? w.rank_pair : '-'}</td>
      <td>${w.limit_price != null ? w.limit_price : '-'}</td>
      <td>${w.live || '-'}</td><td>${status}</td></tr>`;
  }).join('') || '<tr><td colspan="10" class="muted">未来 72 小时暂无比赛</td></tr>';
}
refresh(); setInterval(refresh, 15000);
</script>
</body>
</html>
